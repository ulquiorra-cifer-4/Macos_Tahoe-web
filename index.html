<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>macOS Tahoe — Web Emulator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="lockscreen.css" />
  <link rel="stylesheet" href="menubar.css" />
  <link rel="stylesheet" href="desktop.css" />
  <link rel="stylesheet" href="apps/notes/notes.css" />
  <link rel="stylesheet" href="apps/finder/finder.css" />
  <link rel="stylesheet" href="apps/photos/photos.css" />
  <link rel="stylesheet" href="apps/reminders/reminders.css" />
  <link rel="stylesheet" href="apps/music/music.css" />
  <link rel="stylesheet" href="icon-pack-manager.css" />
</head>
<body>
  <div id="desktop">

    <!-- Wallpaper -->
    <div id="wallpaperLayer"></div>

    <!-- Menu Bar — built by menubar.js -->
    <div id="menuBar"></div>

    <!-- Windows Area -->
    <div id="windows-area"></div>

    <!-- Dock -->
    <div id="dockContainer">
      <div id="dock"></div>
    </div>

  </div>

  <!-- Lock screen — loads first so it's visible immediately -->
  <script src="lockscreen.js"></script>

  <!-- Core -->
  <script src="window-manager.js"></script>

  <!-- Apps -->
  <script src="apps/trash.js"></script>
  <script src="apps/notes/notes-store.js"></script>
  <script src="apps/notes/notes-editor.js"></script>
  <script src="apps/notes/notes-app.js"></script>
  <script src="apps/finder/finder-fs.js"></script>
  <script src="apps/finder/finder-sidebar.js"></script>
  <script src="apps/finder/finder-toolbar.js"></script>
  <script src="apps/finder/finder-grid.js"></script>
  <script src="apps/finder/finder-preview.js"></script>
  <script src="apps/finder/finder-app.js"></script>

  <!-- Photos app -->
  <script src="apps/photos/photos-store.js"></script>
  <script src="apps/photos/photos-sidebar.js"></script>
  <script src="apps/photos/photos-grid.js"></script>
  <script src="apps/photos/photos-lightbox.js"></script>
  <script src="apps/photos/photos-app.js"></script>

  <!-- Reminders app -->
  <script src="apps/reminders/reminders-store.js"></script>
  <script src="apps/reminders/reminders-sidebar.js"></script>
  <script src="apps/reminders/reminders-item.js"></script>
  <script src="apps/reminders/reminders-detail.js"></script>
  <script src="apps/reminders/reminders-app.js"></script>

  <!-- Music app — store must load before player, player before UI -->
  <script src="apps/music/music-store.js"></script>
  <script src="apps/music/music-player.js"></script>
  <script src="apps/music/music-radio.js"></script>
  <script src="apps/music/music-sidebar.js"></script>
  <script src="apps/music/music-content.js"></script>
  <script src="apps/music/music-playbar.js"></script>
  <script src="apps/music/music-app.js"></script>

  <!-- Icon pack manager — must load before dock so it can intercept icon loads -->
  <script src="icon-pack-manager.js"></script>

  <!-- Desktop manager — needs FS loaded first -->
  <script src="desktop-manager.js"></script>

  <!-- Menu bar + Dock — last so everything is registered -->
  <script src="menubar.js"></script>
  <script src="dock.js"></script>

  <!-- Boot desktop manager after all scripts are ready -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof window.__initDesktopManager === "function") {
        window.__initDesktopManager();
      }
    });

    // ── Menubar + Dock entrance animation on unlock ──
    // Patches showLockScreen to also fire __onDesktopUnlock after hide
    (function() {
      function _patchUnlock() {
        const orig = window.showLockScreen;
        // Watch for lockscreen element becoming hidden (opacity 0 / display none)
        // via MutationObserver on the lockscreen element
        const ls = document.getElementById("lockScreen") ||
                   document.querySelector(".lock-screen, #lockscreen, [id*='lock']");
        if (!ls) {
          // Retry after scripts load
          setTimeout(_patchUnlock, 400);
          return;
        }
        const obs = new MutationObserver(() => {
          const hidden = ls.style.display === "none" ||
                         ls.style.opacity === "0"    ||
                         ls.style.pointerEvents === "none" ||
                         ls.classList.contains("hidden") ||
                         ls.classList.contains("gone");
          if (hidden) {
            // Trigger animations
            if (typeof window.__animateMenuBar === "function") window.__animateMenuBar();
            if (typeof window.__animateDock    === "function") window.__animateDock();
          }
        });
        obs.observe(ls, { attributes: true, attributeFilter: ["style","class"] });
      }
      setTimeout(_patchUnlock, 800);
    })();
  </script>
</body>
</html>
